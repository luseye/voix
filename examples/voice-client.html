<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voix — voice agent</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      button {
        font: inherit;
        padding: 0.75rem 2rem;
        border-radius: 999px;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      #status {
        opacity: 0.7;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>voix</h1>
      <p>
        <button id="talk">Start talking</button>
      </p>
      <p id="status">Press the button, then speak.</p>
    </main>
    <script type="module" src="./voice-client.ts"></script>
  </body>
</html>
